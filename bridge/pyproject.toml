[project]
name = "agritwin-bridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
